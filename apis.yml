name: innostic
description: >-
  Innostic is a China-based medical-device distribution and healthcare supply-chain
  company, established in 2015 and originally profiled as a portfolio company of Qiming
  Venture Partners. Its public web presence at www.innostic.com now resolves to the
  Shanghai Jianfa Zhixin Medical Technology group, which operates across medical-device
  distribution, in-vitro diagnostics (IVD), hospital supply-chain management (SPD and
  centralized distribution), and consumer healthcare supply-chain services for
  manufacturers, distributors, and hospitals. The company is a B2B healthcare logistics
  and distribution firm; its only online systems are internal, login-gated operational
  platforms (Zhixin, U9, OA). As of this enrichment pass it publishes no public developer
  portal, API documentation, OpenAPI/AsyncAPI specification, SDK, MCP server, or
  /.well-known discovery surface. This profile records verified company identity and a
  domain-security probe; there is no public API surface to catalog.
